  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>PHENOMENON UNLOCKED<\u002Fdiv>\n      <div style=\"font-family:'Chunk',serif;font-size:clamp(21px,5.6vw,26px);color:#3a2e1d;margin-top:6px;line-height:1.1;\">Synchronous Fireflies<\u002Fdiv>\n      <div style=\"font-family:'LatoR',sans-serif;font-size:13.5px;color:#4a3d28;margin-top:14px;line-height:1.6;text-align:left;\">\n        <sc-if value=\"{{ notMob }}\" hint-placeholder-val=\"{{ true }}\">You logged <b>10 flash patterns<\u002Fb> — enough to earn the swarm's trust. <i>Photinus carolinus<\u002Fi>, the Smokies' famous synchronous firefly, is one of the only species in North America that flashes <b>in unison<\u002Fb>: for about two weeks every June near Elkmont, thousands of males pulse together in the dark.\n        <br><br>\n        The swarm now spirals around you in a synchronized display — and your <b>stamina is fully restored<\u002Fb>. Catch and release 10 more on any clear night to see it again.<\u002Fsc-if>\n        <sc-if value=\"{{ mob }}\" hint-placeholder-val=\"{{ false }}\">You earned the swarm's trust. <i>Photinus carolinus<\u002Fi> flashes <b>in unison<\u002Fb> — they now spiral around you and your <b>stamina is restored<\u002Fb>.<\u002Fsc-if>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ closeSync }}\" style=\"margin-top: 20px; display: inline-block; cursor: pointer; color: #f8ecd6; font-family: 'LatoB',sans-serif; font-size: 13.5px; padding: 10px 28px; border-radius: 22px; background-color: #1F76A8\">Watch the show<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- first cave entry dialog -->\n  <sc-if value=\"{{ caveIntroOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(10,8,5,.55);z-index:70;\"><\u002Fdiv>\n    <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);animation:modalIn .3s ease-out;z-index:71;width:410px;max-width:88vw;background:rgba(38,28,16,.97);border:1.5px solid rgba(233,196,106,.55);border-radius:12px;padding:clamp(15px,4vw,24px) clamp(16px,4.5vw,28px);box-shadow:0 18px 50px rgba(0,0,0,.6);\">\n      <div style=\"display:flex;align-items:center;gap:9px;font-family:'LatoB',sans-serif;font-size:15px;color:#e9c46a;\">⛑️ Headlamp on!<\u002Fdiv>\n      <div style=\"font-family:'LatoR',sans-serif;font-size:13px;line-height:1.6;color:#f3ecd9;margin-top:10px;\">\n        <sc-if value=\"{{ notMob }}\" hint-placeholder-val=\"{{ true }}\">You've entered <b style=\"color:#e9c46a;\">{{ caveIntroName }}<\u002Fb>. Underground it is pitch black — your caving helmet's lamp throws a beam wherever you walk. Rare <b>cave salamanders<\u002Fb> cling to the damp rock and stream banks down here; sweep your beam through the passages and pounce (E) when you spot one.\n        <br><br>\n        Walk back into the daylight at the <b>☀ entrance<\u002Fb> to return to the surface.<\u002Fsc-if>\n        <sc-if value=\"{{ mob }}\" hint-placeholder-val=\"{{ false }}\">You've entered <b style=\"color:#e9c46a;\">{{ caveIntroName }}<\u002Fb>. Your headlamp lights the dark — find rare <b>cave salamanders<\u002Fb> on the wet rock. Exit at the <b>☀ entrance<\u002Fb>.<\u002Fsc-if>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ closeCaveIntro }}\" style=\"cursor: pointer; background: #e9c46a; color: #3a2a14; font-family: 'LatoB',sans-serif; font-size: 16px; padding: 8px 18px; border-radius: 8px; text-align: center\">Explore<\u002Fdiv><div style=\"margin-top:16px;display:flex;justify-content:flex-end;\">\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- cave fact card -->\n  <sc-if value=\"{{ caveFact }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:20;width:430px;max-width:86vw;background:rgba(38,28,16,.93);border:1px solid rgba(233,196,106,.5);border-radius:11px;padding:13px 17px;animation:fadeIn .4s;\">\n      <div style=\"display:flex;align-items:flex-start;gap:10px;\">\n        <span style=\"font-size:17px;\">🔦<\u002Fspa t ranger catch warning -->\n  <sc-if value=\"{{ rangerWarnOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(20,14,8,.6);z-index:64;\" sc-camel-on-click=\"{{ dismissRangerWarn }}\"><\u002Fdiv>\n    <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);animation:modalIn .3s ease-out;z-index:65;width:430px;max-width:88vw;background:#f3ecd9;border-radius:12px;padding:clamp(16px,4vw,28px) clamp(18px,4.5vw,30px);box-shadow:0 22px 66px rgba(0,0,0,.55);border-top:8px solid #a8391f;text-align:center;\">\n      <div style=\"font-size:40px;\">🚔<\u002Fdiv>\n      <div style=\"font-family:'LatoB',sans-serif;font-size:11px;letter-spacing:2px;color:#a8391f;margin-top:8px;\">RANGER RELOCATION · WARNING 1 OF 2<\u002Fdiv>\n      <div style=\"font-family:'Chunk',serif;font-size:clamp(20px,5.4vw,24px);color:#a8391f;margin-top:6px;line-height:1.1;\">You've Been Relocated<\u002Fdiv>\n      <div style=\"font-family:'LatoR',sans-serif;font-size:14px;color:#4a3d28;margin-top:14px;line-height:1.6;text-align:left;\">\n        <sc-if value=\"{{ notMob }}\" hint-placeholder-val=\"{{ true }}\">For your safety and the safety of park visitors, we're placing you on the <b>edge of the park<\u002Fb>. Some of your logged salamanders (<b>{{ rangerWarnLost }}<\u002Fb>) were released back to the wild in the process.\n        <br><br>\n        Scare visitors again and we'll have no choice but to <b style=\"color:#a8391f;\">remove you from the park for good<\u002Fb>.<\u002Fsc-if>\n        <sc-if value=\"{{ mob }}\" hint-placeholder-val=\"{{ false }}\">You've been moved to the park edge and lost <b>{{ rangerWarnLost }}<\u002Fb> logged salamanders. Scare visitors again and you're <b style=\"color:#a8391f;\">out for good<\u002Fb>.<\u002Fsc-if>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ dismissRangerWarn }}\" style=\"margin-top:20px;display:inline-block;cursor:pointer;color:#f8ecd6;background:#a8391f;font-family:'LatoB',sans-serif;font-size:13.5px;padding:11px 30px;border-radius:24px;\">I understand<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ discovery }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(20,14,8,.6);z-index:60;\" sc-camel-on-click=\"{{ closeDiscovery }}\"><\u002Fdiv>\n    <div style=\"position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);animation:modalIn .3s ease-out;z-index:61;width:430px;max-width:88vw;background:#f3ecd9;border-radius:12px;padding:28px 30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.55);text-align:center;border-top:7px solid #a8391f;\">\n      <div style=\"font-family:'LatoB',sans-serif;font-size:11px;letter-spacing:2px;color:#a8391f;\">NEW SPECIES LOGGED · {{ foundCount }}/30<\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 100 62\" style=\"width:170px;height:105px;margin:12px auto 4px;display:block;animation:popIn .45s ease-out;\">\n        <ellipse cx=\"50\" cy=\"49\" rx=\"36\" ry=\"5\" fill=\"rgba(0,0,0,0.09)\"><\u002Fellipse>\n        <path d=\"{{ discovery.svgLegs }}\" stroke=\"{{ discovery.color1 }}\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n        <path d=\"{{ discovery.svgBody }}\" fill=\"{{ discovery.color1 }}\"><\u002Fpath>\n        <path d=\"{{ discovery.svgGrooves }}\" stroke=\"rgba(0,0,0,0.18)\" stroke-width=\"0.8\" fill=\"none\"><\u002Fpath>\n        <path d=\"{{ discovery.svgDetail }}\" stroke=\"{{ discovery.color2 }}\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n        <path d=\"{{ discovery.svgSpots }}\" fill=\"{{ discovery.color2 }}\"><\u002Fpath>\n        <path d=\"{{ discovery.svgEyes }}\" fill=\"#181310\"><\u002Fpath>\n      <\u002Fsvg>\n      <div style=\"font-family:'Chunk',serif;font-size:clamp(19px,5.2vw,23px);color:#3a2e1d;margin-top:6px;line-height:1.1;\">{{ discovery.name }}<\u002Fdiv>\n      <div style=\"font-family:'LatoR',sans-serif;font-style:italic;font-size:13px;color:#8a6a4a;margin-top:3px;\">{{ discovery.sci }}<\u002Fdiv>\n      <div style=\"font-family:'LatoR',sans-serif;font-size:13.5px;color:#4a3d28;margin-top:14px;line-height:1.55;\">{{ discovery.note }}<\u002Fdiv>\n      <div style=\"display:inline-flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center;\">\n        <span style=\"font-family:'LatoB',sans-serif;font-size:11px;color:#5b7a3a;background:#e6ecd0;border-radius:20px;padding:4px 12px;\">{{ discovery.habitatTag }}<\u002Fspan>\n        <span style=\"font-family:'LatoB',sans-serif;font-size:11px;color:#7a5a2a;background:#efe2c4;border-radius:20px;padding:4px 12px;\">{{ discovery.elevTag }}<\u002Fspan>\n        <span style=\"font-family:'LatoB',sans-serif;font-size:11px;color:#a8391f;background:#f2dcc8;border-radius:20px;padding:4px 12px;\">{{ discovery.rarityTag }}<\u002Fspan>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ closeDiscovery }}\" style=\"margin-top: 20px; display: inline-block; cursor: pointer; color: #f8ecd6; font-family: 'LatoB',sans-serif; font-size: 13.5px; padding: 10px 28px; border-radius: 22px; background-color: #0C6905\">Continue Exploring<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- journal panel -->\n  <sc-if value=\"{{ journalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:40;\" sc-camel-on-click=\"{{ toggleJournal }}\"><\u002Fdiv>\n    <div style=\"position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;background:#f3ecd9;z-index:41;box-shadow:-10px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column;\">\n      <div style=\"padding:22px 24px 14px;border-bottom:2px solid #d8c8a0;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n          <div>\n            <div style=\"font-family:'Chunk',serif;font-size:clamp(20px,5.4vw,24px);color:#a8391f;\">FIELD JOURNAL<\u002Fdiv>\n            <div style=\"font-family:'LatoR',sans-serif;font-size:12.5px;color:#7a6650;margin-top:2px;\">{{ foundCount }} of 30 species · rank: {{ rankLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ toggleJournal }}\" style=\"cursor:pointer;font-family:'LatoB',sans-serif;color:#8a6a4a;font-size:24px;line-height:1;\">×<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;height:8px;border-radius:5px;background:#e3d6b4;overflow:hidden;\">\n          <div style=\"height:100%;border-radius:5px;background:linear-gradient(90deg,#5b8a3a,#e2b04a);transition:width .4s;width:{{ progressPct }};\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'LatoR',sans-serif;font-size:11px;color:#a9946e;margin-top:8px;\">Tip: tap 🧭 on an undiscovered species to track its nearest active habitat.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:14px 18px 30px;display:flex;flex-direction:column;gap:9px;\">\n        <sc-for list=\"{{ speciesList }}\" as=\"sp\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;gap:12px;align-items:center;background:{{ sp.rowBg }};border:1.5px solid {{ sp.rowBorder }};border-radius:8px;padding:9px 12px;\">\n            <sc-if value=\"{{ sp.found }}\" hint-placeholder-val=\"{{ false }}\">\n              <svg sc-camel-view-box=\"0 0 100 62\" style=\"width:58px;height:36px;flex:none;\">\n                <path d=\"{{ sp.svgLegs }}\" stroke=\"{{ sp.color1 }}\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n                <path d=\"{{ sp.svgBody }}\" fill=\"{{ sp.color1 }}\"><\u002Fpath>\n                <path d=\"{{ sp.svgDetail }}\" stroke=\"{{ sp.color2 }}\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath>\n                <path d=\"{{ sp.svgSpots }}\" fill=\"{{ sp.color2 }}\"><\u002Fpath>\n                <path d=\"{{ sp.svgEyes }}\" fill=\"#181310\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ sp.locked }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:54px;height:33px;flex:none;display:flex;align-items:center;justify-content:center;background:#e3d6b4;border-radius:6px;color:#a9946e;font-family:'LatoB',sans-serif;font-size:17px;\">?<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"flex:1;min-width:0;\">\n              <sc-if value=\"{{ sp.found }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:7px;\">\n                  <div style=\"font-family:'LatoB',sans-serif;font-size:13.5px;color:#3a2e1d;\">{{ sp.name }}<\u002Fdiv>\n                  <span style=\"font-family:'LatoB',sans-serif;font-size:9.5px;color:{{ sp.rarityColor }};background:{{ sp.rarityBg }};border-radius:12px;padding:2px 8px;flex:none;\">{{ sp.rarityTag }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-family:'LatoR',sans-serif;font-style:italic;font-size:11px;color:#8a6a4a;\">{{ sp.sci }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ sp.locked }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-family:'LatoB',sans-serif;font-size:13px;color:#a9946e;\">Undiscovered<\u002Fdiv>\n                <div style=\"font-family:'LatoR',sans-serif;font-size:11px;color:#a9946e;line-height:1.4;\">{{ sp.hint }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ sp.locked }}\" hint-placeholder-val=\"{{ false }}\">\n              <div sc-camel-on-click=\"{{ sp.trackClick }}\" title=\"Track this species\" style=\"cursor:pointer;flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:{{ sp.trackBg }};border:1.5px solid {{ sp.trackBorder }};\">🧭<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;timeSpeed&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 3, &quot;min&quot;: 1, &quot;max&quot;: 12, &quot;step&quot;: 0.5, &quot;unit&quot;: &quot;min/s&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Gameplay&quot;}, &quot;catchAssist&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Gameplay&quot;}}\">\n// ---------- math / noise helpers ----------\nfunction mulberry32(seed){\n  return function(){\n    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\nfunction makeNoise2D(seed){\n  const rand = mulberry32(seed);\n  const N = 256;\n  const perm = new Float32Array(N * N);\n  for (let i = 0; i < perm.length; i++) perm[i] = rand();\n  function smooth(t){ return t * t * (3 - 2 * t); }\n  return function(x, y){\n    const xi = Math.floor(x) & (N - 1), yi = Math.floor(y) & (N - 1);\n    const xf = x - Math.floor(x), yf = y - Math.floor(y);\n    const x2 = (xi + 1) & (N - 1), y2 = (yi + 1) & (N - 1);\n    const v00 = perm[yi * N + xi], v10 = perm[yi * N + x2], v01 = perm[y2 * N + xi], v11 = perm[y2 * N + x2];\n    const u = smooth(xf), v = smooth(yf);\n    return (v00 * (1 - u) + v10 * u) * (1 - v) + (v01 * (1 - u) + v11 * u) * v;\n  };\n}\nfunction fbmLocal(noise2D, x, y, scale){\n  let total = 0, amp = 1, freq = 1, maxVal = 0;\n  for (let i = 0; i < 4; i++){ total += noise2D(x * scale * freq, y * scale * freq) * amp; maxVal += amp; amp *= 0.5; freq *= 2.1; }\n  return total / maxVal;\n}\nfunction catmullRom(pts, segments){\n  if (pts.length < 3) return pts;\n  const out = [];\n  const get = (i) => pts[Math.max(0, Math.min(pts.length - 1, i))];\n  for (let i = 0; i < pts.length - 1; i++){\n    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);\n    for (let t = 0; t < segments; t++){\n      const tt = t / segments, tt2 = tt * tt, tt3 = tt2 * tt;\n      const x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * tt + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * tt2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * tt3);\n      const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * tt + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * tt2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * tt3);\n      out.push([x, y]);\n    }\n  }\n  out.push(pts[pts.length - 1]);\n  return out;\n}\nfunction meander(pts, amp, freq){\n  const out = [];\n  for (let i = 0; i < pts.length; i++){\n    const p = pts[i];\n    const prev = pts[Math.max(0, i - 1)], next = pts[Math.min(pts.length - 1, i + 1)];\n    const dx = next[0] - prev[0], dy = next[1] - prev[1];\n    const len = Math.hypot(dx, dy) || 1;\n    const nx = -dy / len, ny = dx / len;\n    const off = Math.sin(i * freq) * amp + Math.sin(i * freq * 2.7 + 1) * amp * 0.4;\n    out.push([p[0] + nx * off, p[1] + ny * off]);\n  }\n  return out;\n}\nfunction lerp(a, b, t){ return a + (b - a) * t; }\nfunction clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }\nfunction distToSeg(px, py, ax, ay, bx, by){\n  const dx = bx - ax, dy = by - ay;\n  const l2 = dx * dx + dy * dy;\n  let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;\n  t = clamp(t, 0, 1);\n  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));\n}\nfunction distToPolyline(x, y, pts){\n  let m = Infinity;\n  for (let i = 0; i < pts.length - 1; i++){\n    const d = distToSeg(x, y, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);\n    if (d < m) m = d;\n  }\n  return m;\n}\nfunction nearestOnSpine(x, y, spine){\n  let best = Infinity, bestElev = 2000;\n  for (let i = 0; i < spine.length - 1; i++){\n    const a = spine[i], b = spine[i + 1];\n    const dx = b[0] - a[0], dy = b[1] - a[1];\n    const l2 = dx * dx + dy * dy;\n    let t = l2 > 0 ? ((x - a[0]) * dx + (y - a[1]) * dy) / l2 : 0;\n    t = clamp(t, 0, 1);\n    const d = Math.hypot(x - (a[0] + dx * t), y - (a[1] + dy * t));\n    if (d < best){ best = d; bestElev = lerp(a[2], b[2], t); }\n  }\n  return { dist: best, elev: bestElev };\n}\n\n// ---------- tiny synth SFX ----------\nconst SFX = {\n  muted: false, ctx: null, rainNode: null, rainGain: null,\n  ensure(){\n    if (!this.ctx){\n      const AC = window.AudioContext || window.webkitAudioContext;\n      if (!AC) return false;\n      this.ctx = new AC();\n    }\n    if (this.ctx.state === 'suspended') this.ctx.resume();\n    return true;\n  },\n  tone(freq, dur, type, vol, when, slideTo){\n    const c = this.ctx, t0 = c.currentTime + (when || 0);\n    const o = c.createOscillator(), g = c.createGain();\n    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);\n    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);\n    g.gain.setValueAtTime(0, t0);\n    g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.012);\n    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n    o.connect(g); g.connect(c.destination);\n    o.start(t0); o.stop(t0 + dur + 0.05);\n  },\n  play(name){\n    if (this.muted || !this.ensure()) return;\n    // throttle: never let the same sound machine-gun into a \"bumping\" drone\n    const now = (this.ctx && this.ctx.currentTime) || 0;\n    this._last = this._last || {};\n    if (now - (this._last[name] || -1) < 0.28) return;\n    this._last[name] = now;\n    switch (name){\n      case 'click': this.tone(660, 0.07, 'triangle', 0.07); break;\n      case 'food': this.tone(392, 0.1, 'triangle', 0.1); this.tone(523, 0.14, 'triangle', 0.1, 0.09); break;\n      case 'miss': this.tone(240, 0.22, 'sawtooth', 0.05, 0, 130); break;\n      case 'sniff': this.tone(300, 0.08, 'sine', 0.06); this.tone(340, 0.08, 'sine', 0.06, 0.1); break;\n      case 'catchStart': this.tone(880, 0.06, 'square', 0.045); break;\n      case 'pounce': this.tone(180, 0.16, 'triangle', 0.12, 0, 90); break;\n      case 'success': this.tone(523, 0.13, 'triangle', 0.11); this.tone(659, 0.13, 'triangle', 0.11, 0.11); this.tone(784, 0.24, 'triangle', 0.12, 0.22); break;\n      case 'rank': this.tone(392, 0.12, 'triangle', 0.11); this.tone(523, 0.12, 'triangle', 0.11, 0.11); this.tone(659, 0.12, 'triangle', 0.11, 0.22); this.tone(784, 0.32, 'triangle', 0.13, 0.33); break;\n    }\n  },\n  setRain(on){\n    if (!this.ctx) return;\n    if (on && !this.rainNode){\n      const c = this.ctx, len = c.sampleRate * 2;\n      const buf = c.createBuffer(1, len, c.sampleRate);\n      const d = buf.getChannelData(0);\n      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;\n      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;\n      const filt = c.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 900;\n      const g = c.createGain(); g.gain.value = 0;\n      src.connect(filt); filt.connect(g); g.connect(c.destination);\n      src.start();\n      this.rainNode = src; this.rainGain = g;\n    }\n    if (this.rainGain){\n      const target = (on && !this.muted) ? 0.05 : 0.0001;\n      this.rainGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.8);\n    }\n  }\n};\n\n// ---------- species table ----------\nconst HABITAT_LABEL = {\n  stream: 'fast mountain streams', seep: 'mossy seeps & springheads', pond: 'still ponds & vernal pools',\n  cave: 'cave mouths & sinkholes', 'cove-forest': 'rich cove hardwood forest', 'hardwood-forest': 'hardwood forest floor',\n  'high-forest': 'high-elevation forest', 'spruce-fir': 'spruce-fir summits', bald: 'grassy balds',\n  'rock-outcrop': 'rock outcrops & crevices', floodplain: 'low floodplain woods'\n};\nconst HABITAT_TAG = {\n  stream: 'streams', seep: 'seeps & springs', pond: 'ponds', cave: 'caves', 'cove-forest': 'cove forest',\n  'hardwood-forest': 'hardwood forest', 'high-forest': 'high forest', 'spruce-fir': 'spruce-fir', bald: 'grassy balds', 'rock-outcrop': 'rock outcrops', floodplain: 'floodplain'\n};\nconst TIME_LABEL = { night: 'after dark', 'dusk-night': 'dusk onward', day: 'daytime', any: 'any time' };\nconst WEATHER_LABEL = { rain: 'during rain', wet: 'when everything is soaked', any: '' };\nconst RARITY_LABEL = { common: 'Common', uncommon: 'Uncommon', rare: 'Rare', 'very-rare': 'Very Rare' };\nconst RARITY_ZONE = { common: 0.68, uncommon: 0.52, rare: 0.39, 'very-rare': 0.28 };\nconst RARITY_SPEED = { common: 3.2, uncommon: 3.9, rare: 4.7, 'very-rare': 5.5 };\nconst RARITY_FLEE = { common: 52, uncommon: 62, rare: 74, 'very-rare': 86 };\nconst RARITY_SPAWN = { common: 0.5, uncommon: 0.3, rare: 0.18, 'very-rare': 0.11 };\nconst RARITY_COLOR = { common: '#5b7a3a', uncommon: '#3f7691', rare: '#7a5a2a', 'very-rare': '#a8391f' };\nconst RARITY_BG = { common: '#e6ecd0', uncommon: '#dbe7ec', rare: '#efe2c4', 'very-rare': '#f2dcc8' };\nconst RANKS = [\n  [0, 'Wandering Cub'], [5, 'Curious Yearling'], [10, 'Creek Forager'],\n  [18, 'Ridge Naturalist'], [25, 'Storm Tracker'], [30, 'Legend of the Smokies']\n];\nfunction rankFor(n){\n  let r = RANKS[0][1];\n  for (const [min, name] of RANKS) if (n >= min) r = name;\n  return r;\n}\nconst PALETTES = [\n  ['#5b4530', '#c9a25a'], ['#8a3b2a', '#e0b04a'], ['#3f4a2c', '#9db06a'], ['#4a3626', '#d97a4a'],\n  ['#6b3f2a', '#f0d060'], ['#35362a', '#c98a3b'], ['#7a4a30', '#f2e0b0'], ['#2e3b2c', '#8ab090'],\n  ['#5a2e22', '#e8934a'], ['#463a26', '#b8a468']\n];\nconst SPECIES = [\n  { id: 1, name: 'Eastern Hellbender', sci: 'Cryptobranchus alleganiensis', habitats: ['stream'], elevMin: 1200, elevMax: 3000, moistureMin: 0.72, time: 'night', weather: 'any', rarity: 'rare', pattern: 'plain', note: \"A giant among salamanders, hiding under slab rocks in clean, fast rivers — a living sign of a healthy stream.\" },\n  { id: 2, name: 'Spring Salamander', sci: 'Gyrinophilus porphyriticus', habitats: ['seep', 'stream', 'cave'], elevMin: 1200, elevMax: 5000, moistureMin: 0.68, time: 'night', weather: 'any', rarity: 'uncommon', pattern: 'plain', note: 'S : 'any', rarity: 'common', pattern: 'spotted', note: \"The bright orange terrestrial \\u2018red eft\\u2019 stage roams the forest floor in broad daylight, warning off predators.\" },\n  { id: 28, name: 'Eastern Red-backed Salamander', sci: 'Plethodon cinereus', habitats: ['high-forest', 'spruce-fir'], elevMin: 4500, elevMax: 6643, moistureMin: 0.35, time: 'night', weather: 'any', rarity: 'uncommon', pattern: 'striped', note: 'A northern species finding refuge from the heat only at the park\\u2019s highest, coolest elevations.' },\n  { id: 29, name: 'Yonahlossee Salamander', sci: 'Plethodon yonahlossee', habitats: ['cove-forest', 'rock-outcrop'], elevMin: 3000, elevMax: 5000, moistureMin: 0.45, time: 'night', weather: 'rain', rarity: 'very-rare', pattern: 'spotted', note: 'Large and strikingly patterned, sheltering in rock crevices within rich cove forest.' },\n  { id: 30, name: 'Southern Dusky Salamander', sci: 'Desmognathus auriculatus', habitats: ['floodplain', 'seep'], elevMin: 1200, elevMax: 1800, moistureMin: 0.75, time: 'night', weather: 'any', rarity: 'very-rare', pattern: 'plain', note: \"A soggy floodplain specialist clinging on only at the park\\u2019s lowest, wettest edges.\" }\n].map((s, i) => ({ ...s, color1: PALETTES[i % PALETTES.length][0], color2: PALETTES[i % PALETTES.length][1] }));\n\n// ---------- realistic salamander art (shared width profile + SVG generator) ----------\nfunction salWidth(t){\n  const K = [[0, 2.0], [0.07, 5.2], [0.16, 3.7], [0.3, 5.3], [0.5, 5.5], [0.65, 4.1], [0.8, 2.3], [1, 0.25]];\n  for (let i = 0; i < K.length - 1; i++){\n    if (t >= K[i][0] && t <= K[i + 1][0]){\n      const u = (t - K[i][0]) / (K[i + 1][0] - K[i][0]);\n      return lerp(K[i][1], K[i + 1][1], u * u * (3 - 2 * u));\n    }\n  }\n  return 0.25;\n}\nfunction makeSalSVG(seed, pattern){\n  const rnd = mulberry32(seed * 77 + 3);\n  const ph = rnd() * 6.28, arc = 2.2 + rnd() * 1.6, amp = 3 + rnd() * 3.2;\n  const N = 26;\n  const spine = [];\n  for (let i = 0; i < N; i++){\n    const t = i / (N - 1);\n    spine.push([90 - t * 80, 30 + Math.sin(t * arc + ph) * amp * (0.35 + t * 0.9)]);\n  }\n  const tang = (i) => {\n    const a = spine[Math.max(0, i - 1)], b = spine[Math.min(N - 1, i + 1)];\n    const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;\n    return [dx / l, dy / l];\n  };\n  const P = (p) => p[0].toFixed(1) + ',' + p[1].toFixed(1);\n  let body = '';\n  for (let i = 0; i < N; i++){\n    const t = i / (N - 1), wd = salWidth(t), [tx, ty] = tang(i);\n    body += (i ? 'L' : 'M') + (spine[i][0] - ty * wd).toFixed(1) + ',' + (spine[i][1] + tx * wd).toFixed(1);\n  }\n  for (let i = N - 1; i >= 0; i--){\n    const t = i / (N - 1), wd = salWidth(t), [tx, ty] = tang(i);\n    body += 'L' + (spine[i][0] + ty * wd).toFixed(1) + ',' + (spine[i][1] - tx * wd).toFixed(1);\n  }\n  body += 'Z';\n  let legs = '';\n  for (const lt of [0.2, 0.55]){\n    const i = Math.round(lt * (N - 1)), [tx, ty] = tang(i);\n    for (const s of [1, -1]){\n      const wd = salWidth(lt) * 0.7;\n      const bx = spine[i][0] - s * ty * wd, by = spine[i][1] + s * tx * wd;\n      const sw = (lt < 0.4 ? 1 : -1) * 2.2;\n      const kx = bx - s * ty * 5 + tx * sw, ky = by + s * tx * 5 + ty * sw;\n      const fx = kx - s * ty * 2.6 + tx * sw * 0.9, fy = ky + s * tx * 2.6 + ty * sw * 0.9;\n      legs += `M${bx.toFixed(1)},${by.toFixed(1)}L${kx.toFixed(1)},${ky.toFixed(1)}L${fx.toFixed(1)},${fy.toFixed(1)}`;\n      for (let tn = -1; tn <= 1; tn++){\n        legs += `M${fx.toFixed(1)},${fy.toFixed(1)}l${(-s * ty * 2.4 + tx * tn * 1.6).toFixed(1)},${(s * tx * 2.4 + ty * tn * 1.6).toFixed(1)}`;\n      }\n    }\n  }\n  let grooves = '';\n  for (let t = 0.24; t <= 0.62; t += 0.055){\n    const i = Math.round(t * (N - 1)), [tx, ty] = tang(i), wd = salWidth(t) * 0.72;\n    grooves += `M${(spine[i][0] - ty * wd).toFixed(1)},${(spine[i][1] + tx * wd).toFixed(1)}L${(spine[i][0] + ty * wd).toFixed(1)},${(spine[i][1] - tx * wd).toFixed(1)}`;\n  }\n  let detail = '';\n  if (pattern === 'striped'){\n    detail = 'M' + P(spine[2]);\n    for (let i = 3; i < N - 2; i++) detail += 'L' + P(spine[i]);\n  }\n  let spots = '';\n  if (pattern === 'spotted'){\n    for (let t = 0.1; t <= 0.86; t += 0.085){\n      const i = Math.round(t * (N - 1)), [tx, ty] = tang(i);\n      const off = (Math.round(t * 20) % 2 ? 1 : -1) * salWidth(t) * 0.42;\n      const cx = spine[i][0] - ty * off, cy = spine[i][1] + tx * off, r = 1.1 + rnd() * 0.5;\n      spots += `M${(cx - r).toFixed(1)},${cy.toFixed(1)}a${r.toFixed(1)},${r.toFixed(1)} 0 1,0 ${(r * 2).toFixed(1)},0a${r.toFixed(1)},${r.toFixed(1)} 0 1,0 ${(-r * 2).toFixed(1)},0`;\n    }\n  }\n  const i0 = Math.round(0.07 * (N - 1)), [tx0, ty0] = tang(i0);\n  let eyes = '';\n  for (const s of [1, -1]){\n    const ex = spine[i0][0] - s * ty0 * salWidth(0.07) * 0.62, ey = spine[i0][1] + s * tx0 * salWidth(0.07) * 0.62;\n    eyes += `M${(ex - 0.9).toFixed(1)},${ey.toFixed(1)}a0.9,0.9 0 1,0 1.8,0a0.9,0.9 0 1,0 -1.8,0`;\n  }\n  return { body, legs, grooves, detail, spots, eyes };\n}\nconst SAL_SVG = {};\nSPECIES.forEach((s) => { SAL_SVG[s.id] = makeSalSVG(s.id, s.pattern); });\n\n// ---------- ambient wildlife ----------\nconst WILDLIFE = [\n  { kind: 'deer', name: 'White-tailed Deer', sci: 'Odocoileus virginianus', fact: 'The park\\u2019s most-seen mammal \\u2014 look for the raised white tail flag when one bolts.', habitats: ['floodplain', 'cove-forest', 'hardwood-forest'], time: ['day', 'dusk'], fleeR: 150, fleeSp: 250, wanderSp: 22, weight: 0.32 },\n  { kind: 'elk', name: 'Elk', sci: 'Cervus canadensis', fact: 'Reintroduced to Cataloochee in 2001 after a 150-year absence from the Smokies.', habitats: ['floodplain'], time: ['day', 'dusk'], fleeR: 130, fleeSp: 210, wanderSp: 15, weight: 0.16 },\n  { kind: 'turkey', name: 'Wild Turkey', sci: 'Meleagris gallopavo', fact: 'Flocks forage the coves by day and roost high in trees at night.', habitats: ['floodplain', 'hardwood-forest', 'cove-forest'], time   const foundSet = new Set(this.state.foundIds);\n        const trackedId = this.state.trackedId;\n        for (let attempt = 0; attempt < 10; attempt++){\n          let x, y;\n          if (this.inCave){\n            const pt = this.randomCavePoint();\n            if (!pt) continue;\n            x = pt.x; y = pt.y;\n          } else {\n            const ang = Math.random() * Math.PI * 2;\n            const rr = 130 + Math.random() * 240;\n            x = bear.x + Math.cos(ang) * rr; y = bear.y + Math.sin(ang) * rr;\n            if (x < 20 || y < 20 || x > this.WORLD_W - 20 || y > this.WORLD_H - 20) continue;\n          }\n          const s = this.sampleAt(x, y);\n          const pool = SPECIES.filter((sp) => !foundSet.has(sp.id) && this.speciesMatch(sp, s, tp, weather));\n          if (!pool.length) continue;\n          // bias toward tracked species\n          let sp = null;\n          const trackedHere = pool.find((p) => p.id === trackedId);\n          if (trackedHere && Math.random() < 0.6) sp = trackedHere;\n          else {\n            for (const cand of pool){ if (Math.random() < RARITY_SPAWN[cand.rarity] * 1.5){ sp = cand; break; } }\n            if (!sp) sp = pool[Math.floor(Math.random() * pool.length)];\n          }\n          if (!sp) continue;\n          if (this.critters.some((c) => c.sp.id === sp.id)) continue;\n          const dir0 = Math.random() * Math.PI * 2;\n          this.critters.push({\n            sp, x, y, vx: 0, vy: 0, dir: dir0, heading: dir0, speed: 0,\n            state: 'wander', wt: Math.random() * 2, ph: Math.random() * 10,\n            spook: 0, alertT: 0\n          });\n          break;\n        }\n      }\n    }\n    // behavior — smooth steering (no jitter)\n    for (const c of this.critters){\n      const d = Math.hypot(c.x - bear.x, c.y - bear.y);\n      const fleeR = 88, calmR = 150;\n      if (c.spook > 0) c.spook -= dt;\n      if (d < fleeR || c.spook > 0){\n        if (c.state !== 'flee'){ c.state = 'flee'; c.alertT = 0.35  (a.wt <= 0){ a.wt = 1.5 + Math.random() * 3; a.dir = a.heading + (Math.random() - 0.5) * 2; a.pause = Math.random() < 0.55; }\n        tDir = a.dir || a.heading; tSp = a.pause ? 0 : a.w.wanderSp;\n      }\n      let dh = tDir - a.heading;\n      while (dh > Math.PI) dh -= Math.PI * 2;\n      while (dh < -Math.PI) dh += Math.PI * 2;\n      a.heading += dh * Math.min(1, (a.state === 'flee' ? 6 : 2.4) * dt);\n      a.speed = lerp(a.speed, tSp, Math.min(1, dt * 4));\n      a.ph += dt * (1.5 + a.speed * 0.05);\n      a.x = clamp(a.x + Math.cos(a.heading) * a.speed * dt, 20, this.WORLD_W - 20);\n      a.y = clamp(a.y + Math.sin(a.heading) * a.speed * dt, 20, this.WORLD_H - 20);\n      if (d < 120) this.encounterWildlife(a.w);\n    }\n  }\n\n  updateRivals(dt){\n    const bear = this.bear;\n    for (const r of this.rivals){\n      if (r.placatedT > 0) r.placatedT -= dt;\n      if (r.hitCd > 0) r.hitCd -= dt;\n      if (r.growlCd > 0) r.growlCd -= dt;\n      const d = Math.hypot(r.x - bear.x, r.y - bear.y);\n      const placated = r.placatedT > 0;\n      // first rival encounter: show an explainer bubble and hold aggression while it's up\n      if (false && !this.state.introSeen && !this.rivalIntro && d < 300){\n        this.rivalIntro = { r, t: 16 };\n        this.setState({ introSeen: true, rivalAlert: true });\n        clearTimeout(this._rivalAlertT);\n        this._rivalAlertT = setTimeout(() => this.setState({ rivalAlert: null }), 5200);\n      }\n      const introHere = this.rivalIntro && this.rivalIntro.r === r;\n      let tDir, tSp;\n      if (!placated && !introHere && d < 190){\n        // territorial — advance on the intruder\n        r.state = 'chase';\n        tDir = Math.atan2(bear.y - r.y, bear.x - r.x);\n        tSp = 118;\n        if (d < 220 && r.growlCd <= 0){ r.growlCd = 3.5; this.showToast('🐻 ' + r.name + ' huffs and stomps — offer berries (E) or back off!'); }\n        if (d < 46 && r.hitCd <= 0){\n          r.hitCd = 1.6;\n          this.shake = 10;\ l();\n      }\n      ctx.fillStyle = '#2a2230'; ctx.beginPath(); ctx.ellipse(-1, 0, 3, 1.8, 0, 0, 7); ctx.fill();\n      ctx.beginPath(); ctx.arc(1.4, 0, 1.6, 0, 7); ctx.fill();\n      // ears\n      ctx.beginPath(); ctx.moveTo(1.6, -1); ctx.lineTo(2.6, -3); ctx.lineTo(2.8, -0.8); ctx.closePath(); ctx.fill();\n      ctx.beginPath(); ctx.moveTo(1.6, 1); ctx.lineTo(2.6, 3); ctx.lineTo(2.8, 0.8); ctx.closePath(); ctx.fill();\n    }\n    ctx.restore();\n    const d = Math.hypot(nf.x - this.bear.x, nf.y - this.bear.y);\n    if (d < 120){\n      ctx.save();\n      ctx.font = '700 10px LatoB, sans-serif'; ctx.textAlign = 'center';\n      ctx.strokeStyle = 'rgba(20,26,14,0.8)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';\n      const nm = NIGHTFLY_INFO[nf.type].name;\n      ctx.strokeText(nm, x, y - 16); ctx.fillStyle = '#f0e3c0'; ctx.fillText(nm, x, y - 16);\n      ctx.restore();\n    }\n  }\n\n  // first-encounter explainer bubble above a rival bear\n  drawIntroBubble(ctx, ox, oy){\n    const intro = this.rivalIntro, r = intro.r;\n    const bx = r.x - ox, by = r.y - oy;\n    if (bx < -120 || bx > this.viewW + 120 || by < -120 || by > this.viewH + 120) return;\n    const lines = [\n      'Food is scarce in these mountains, and every bear',\n      'guards its own patch of forest. Wander too close',\n      'and ' + r.name + ' will charge and swat.',\n      '',\n      'Offer 3 berries from your pouch (E) to placate a',\n      'rival. Fill the pouch at berry bushes — 10 max.'\n    ];\n    const w = 356, pad = 14, lh = 16.5, titleH = 22;\n    const h = pad * 2 + titleH + lines.length * lh;\n    const x = clamp(bx, w / 2 + 12, this.viewW - w / 2 - 12) - w / 2;\n    const y = Math.max(10, by - 52 - h);\n    ctx.save();\n    ctx.globalAlpha = clamp(Math.min(intro.t / 0.5, (16 - intro.t) / 0.4 + 1), 0, 1);\n    ctx.fillStyle = 'rgba(38,28,16,0.94)';\n    ctx.strokeStyle = 'rgba(233,196,106,0.55)';\n    ctx.lineWidth = 1.5;\n    ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fil  ctx.fill();\n    ctx.fillStyle = lite;\n    ctx.beginPath(); ctx.ellipse(23.5, -6.5, 4, 3, 0, 0, 7); ctx.fill();\n    ctx.fillStyle = '#140d07';\n    ctx.beginPath(); ctx.arc(26.5, -6.5, 1.5, 0, 7); ctx.fill();\n    ctx.beginPath(); ctx.arc(20.5, -10, 1.3, 0, 7); ctx.fill();\n    // ears\n    ctx.fillStyle = mid;\n    ctx.beginPath(); ctx.arc(13.5, -14.5, 3.2, 0, 7); ctx.fill();\n    ctx.beginPath(); ctx.arc(19.5, -14.5, 3.2, 0, 7); ctx.fill();\n    ctx.restore();\n    // status marker\n    ctx.save();\n    ctx.translate(x, y - 34);\n    if (placated){\n      const bounce = Math.sin(now * 3) * 1.5;\n      ctx.font = '12px sans-serif'; ctx.textAlign = 'center';\n      ctx.fillText('❤️', 0, bounce);\n    } else if (r.state === 'chase'){\n      ctx.font = '700 13px LatoB, sans-serif'; ctx.textAlign = 'center';\n      ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(20,14,8,0.8)'; ctx.lineWidth = 3;\n      ctx.strokeText('!', 0, 0); ctx.fillStyle = '#e05a3a'; ctx.fillText('!', 0, 0);\n    }\n    ctx.restore();\n  }\n\n  addScare(){\n    if (this.inCave || this.inDome) return;\n    const s = (this.state.scares || 0) + 1;\n    this.setState({ scares: s });\n    if (s >= 5 && !this.state.rangerActive && !this.ranger){ this.spawnRanger(); }\n    else if (!this.state.rangerActive){ this.showToast('\\uD83D\\uDE30 Scared a hiker! (' + s + '/5 before a ranger is called)'); }\n  }\n  spawnRanger(){\n    const ang = Math.random() * 6.28;\n    this.ranger = {\n      x: clamp(this.bear.x + Math.cos(ang) * 720, 20, this.WORLD_W - 20),\n      y: clamp(this.bear.y + Math.sin(ang) * 720, 20, this.WORLD_H - 20),\n      heading: 0, ph: 0, hitCd: 0\n    };\n    this.setState({ rangerActive: true, rangerAlert: true });\n    SFX.play('miss');\n    clearTimeout(this._rangerAlertT);\n    this._rangerAlertT = setTimeout(() => this.setState({ rangerAlert: null }), 3600);\n  }\n  updateTownEvents(dt){\n    const CELL = this.CELL, bx = this.bear.x, by = this.bear.y;\n    // ---- Gatlinburg: warning sign pops up, tourists rush out to take photos\n    const gx = 305 * CELL, gy = 10 * CELL;\n    const nearG = Math.hypot(bx - gx, by - gy) < 150;\n    this._nearGburg = nearG;\n    if (this._gburgSignT > 0) this._gburgSignT -= dt;\n    if (nearG && !this._gburgSeen){\n      this._gburgSeen = true;\n      this._gburgSignT = 5;\n      const rnd = mulberry32(Math.floor(performance.now()) | 1);\n      this.tourists = [];\n      for (let i = 0; i < 5; i++){\n        const ang = rnd() * Math.PI * 2, rr = 60 + rnd() * 40;\n        this.tourists.push({\n          x: bx + Math.cos(ang) * rr, y: by + Math.sin(ang) * rr,\n          hx: bx + Math.cos(ang) * rr, hy: by + Math.sin(ang) * rr,\n          ph: rnd() * 10, flash: 0, flashCd: rnd() * 1.5,\n          shirt: ['#c0492e', '#2f6d8c', '#c9a23a', '#4a7a4e', '#8a4a6d'][i % 5]\n        });\n      }\n    }\n    if (!nearG && this.tourists.length){ this._gburgSeen = false; this.tourists = []; }\n    // tourists keep their distance, jostle a bit, and snap photos (flash) — only while you're in town\n    if (nearG) for (const t of this.tourists){\n      const d = Math.hypot(t.x - bx, t.y - by);\n      const want = 68;\n      const ang = Math.atan2(t.y - by, t.x - bx);\n      const tx = bx + Math.cos(ang) * want, ty = by + Math.sin(ang) * want;\n      t.x += (tx - t.x) * Math.min(1, dt * 2.2) + Math.sin(t.ph + performance.now() / 600) * 0.3;\n      t.y += (ty - t.y) * Math.min(1, dt * 2.2);\n      t.ph += dt;\n      t.flashCd -= dt;\n      if (t.flashCd <= 0){ t.flashCd = 1.2 + Math.random() * 1.8; t.flash = 0.18; }\n      if (t.flash > 0) t.flash -= dt;\n    }\n    // ---- Sugarlands Visitor Center: a ranger steps out and warns, then gives chase\n    const vc = this.vc; if (!vc) return;\n    const nearVC = Math.hypot(bx - vc.x, by - vc.y) < 140;\n    const hasSmokies = (this.state.books || []).includes(SMOKIES_BOOK);\n    if (hasSmokies && nearVC && !this._bookDelivering && !this.state.bookDelivered){\n      this._bookDelivering
