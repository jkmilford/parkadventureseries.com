    </script>

    <!-- Babel standalone manual trigger (in case DOMContentLoaded already fired) -->
    <script>
      // This runs after the document swap / unpack
      function runBabelTransform() {
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          try {
            window.Babel.transformScriptTags();
            console.log('✅ Babel transformed script tags manually');
          } catch (babelErr) {
            console.warn('Babel transform failed:', babelErr);
          }
        }
      }

      // Run it immediately (the previous DOMContentLoaded already passed)
      runBabelTransform();

      // Also run it again after a short delay in case any dynamic scripts are added
      setTimeout(runBabelTransform, 100);
    </script>
  </body>
</html>
