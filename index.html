<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park Adventure Series – Activity Books for the Whole Family</title>
<meta name="description" content="Fun and educational activity books for America's greatest national parks. Puzzles, games, and adventures for the whole family.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ───────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--forest: #2a4a2a;
--forest-mid: #3a5c3a;
--forest-light: #4e7a4e;
--cream: #f5f0e8;
--cream-dark: #ddd5c3;
--brown: #7a5c3a;
--brown-dark: #4a3520;
--white: #ffffff;
--text: #2a2a2a;
--text-muted: #666;
--gold: #c9a84c;
}

html { scroll-behavior: smooth; }

body {
font-family: 'Source Sans 3', sans-serif;
background: var(--cream);
color: var(--text);
line-height: 1.6;
}

/* ── NAV ────────────────────────────────────── */
nav {
background: var(--forest);
padding: 0.9rem 2rem;
display: flex;
align-items: center;
justify-content: space-between;
position: sticky;
top: 0;
z-index: 100;
box-shadow: 0 2px 12px rgba(0,0,0,0.25);
}

.nav-brand {
font-family: 'Playfair Display', serif;
font-size: 1.05rem;
color: var(--cream);
text-decoration: none;
letter-spacing: 0.03em;
}

.nav-links {
display: flex;
gap: 1.75rem;
list-style: none;
}

.nav-links a {
color: var(--cream-dark);
text-decoration: none;
font-size: 0.9rem;
font-weight: 600;
letter-spacing: 0.04em;
text-transform: uppercase;
transition: color 0.2s;
}

.nav-links a:hover { color: var(--white); }

@media (max-width: 600px) {
.nav-links { display: none; }
}

/* ── HERO ───────────────────────────────────── */
.hero {
background: var(--forest);
position: relative;
padding: 5rem 2rem 6rem;
text-align: center;
}

.hero-mountains {
position: absolute;
bottom: 0; left: 0; right: 0;
width: 100%;
height: 40%;
opacity: 0.12;
display: block;
}

.hero-eyebrow {
font-size: 0.78rem;
font-weight: 700;
letter-spacing: 0.22em;
text-transform: uppercase;
color: var(--cream-dark);
margin-bottom: 1rem;
position: relative;
}

.hero h1 {
font-family: 'Playfair Display', serif;
font-size: clamp(2.4rem, 6vw, 4rem);
font-weight: 900;
color: var(--white);
line-height: 1.1;
max-width: 700px;
margin: 0 auto 1.25rem;
position: relative;
}

.hero h1 em {
font-style: normal;
color: var(--cream-dark);
}

.hero-sub {
font-size: 1.1rem;
color: var(--cream-dark);
max-width: 520px;
margin: 0 auto 2rem;
position: relative;
}

.hero-cta {
display: inline-block;
background: var(--cream);
color: var(--forest);
font-weight: 700;
font-size: 0.95rem;
letter-spacing: 0.05em;
text-transform: uppercase;
text-decoration: none;
padding: 0.85em 2.2em;
border-radius: 3px;
position: relative;
transition: background 0.2s, transform 0.15s;
}

.hero-cta:hover {
background: var(--white);
transform: translateY(-2px);
}

/* ── SECTION HELPERS ────────────────────────── */
.section-header {
text-align: center;
padding: 4rem 2rem 2rem;
}

.section-eyebrow {
font-size: 0.75rem;
font-weight: 700;
letter-spacing: 0.2em;
text-transform: uppercase;
color: var(--forest-light);
margin-bottom: 0.6rem;
}

.section-header h2 {
font-family: 'Playfair Display', serif;
font-size: clamp(1.8rem, 4vw, 2.6rem);
color: var(--brown-dark);
line-height: 1.2;
}

.section-divider {
width: 60px;
height: 3px;
background: var(--forest-light);
margin: 1rem auto 0;
border-radius: 2px;
}

/* ── BOOK GRID ──────────────────────────────── */
.books-section {
padding: 1rem 2rem 5rem;
}

.book-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
gap: 1.75rem;
max-width: 1100px;
margin: 0 auto;
}

@media (max-width: 600px) {
.book-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
}

.book-card {
background: var(--white);
border-radius: 6px;
overflow: hidden;
box-shadow: 0 3px 16px rgba(0,0,0,0.1);
transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.book-card:hover {
transform: translateY(-5px);
box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.book-cover {
position: relative;
aspect-ratio: 3/4;
overflow: hidden;
}

.book-cover img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

.book-info {
padding: 1.1rem 1.2rem 1.3rem;
}

.book-info h3 {
font-family: 'Playfair Display', serif;
font-size: 1rem;
color: var(--brown-dark);
margin-bottom: 0.4rem;
line-height: 1.3;
}

.book-info p {
font-size: 0.83rem;
color: var(--text-muted);
line-height: 1.5;
margin-bottom: 0.9rem;
}

.book-link {
display: inline-block;
font-size: 0.8rem;
font-weight: 700;
letter-spacing: 0.05em;
text-decoration: none;
text-transform: uppercase;
padding: 0.45em 1em;
border-radius: 3px;
transition: background 0.2s, color 0.2s;
}

.book-link.available {
background: var(--forest);
color: var(--white);
}

.book-link.available:hover { background: var(--forest-mid); }

/* ── EXPLORER PACK / KIT FORM SECTION ──────── */
.signup-section {
background: var(--cream);
padding: 5rem 2rem;
border-top: 1px solid var(--cream-dark);
border-bottom: 1px solid var(--cream-dark);
}

.signup-section .section-header {
padding-top: 0;
}

.kit-form-container {
max-width: 900px;
margin: 0 auto;
}

/* ── ABOUT ──────────────────────────────────── */
.about-section {
padding: 5rem 2rem;
background: var(--white);
